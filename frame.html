<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>감탄 액자</title>
<style>
  html,body{height:100%;margin:0;background:#000;overflow:hidden}
  body{
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;color:#F2EDE4;
    user-select:none;-webkit-user-select:none;cursor:none;
  }
  #stage{position:fixed;inset:0;overflow:hidden;background:#000}

  .slot{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease}
  .slot.on{opacity:1}
  .panes{position:absolute;inset:0;display:flex}
  .pane{position:relative;flex:1;overflow:hidden}
  .pane + .pane{border-left:1px solid rgba(255,255,255,.08)}
  .pane .bg{
    position:absolute;inset:-10%;background-size:cover;background-position:center;
    filter:blur(46px) brightness(.4) saturate(1.1);
  }
  .pane img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}

  #sender{
    position:absolute;left:26px;bottom:24px;
    font-size:15px;letter-spacing:.01em;color:rgba(255,255,255,.88);
    text-shadow:0 2px 20px rgba(0,0,0,.85);
    opacity:0;transform:translateY(8px);
    transition:opacity .8s ease,transform .8s ease;pointer-events:none;
  }
  #sender.on{opacity:1;transform:none}
  #sender i{
    display:block;width:24px;height:1px;background:#B08D57;
    margin-bottom:8px;
  }

  /* 밤 */
  #night{
    position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;
    transition:opacity 2.5s ease;
  }
  #night.on{opacity:1;pointer-events:auto}

  /* 안내 */
  #msg{
    position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:32px;
  }
  #msg .m{font-family:Georgia,serif;font-size:12px;letter-spacing:.42em;
    color:#B08D57;text-transform:uppercase;margin-bottom:18px}
  #msg h1{font-size:19px;font-weight:500;line-height:1.7;color:rgba(255,255,255,.9);margin:0}
  #msg p{margin:9px 0 0;font-size:13px;color:#7C7168;line-height:1.7}
  #msg[hidden]{display:none}

  /* 숨은 문 */
  #corner{position:absolute;left:0;top:0;width:15%;height:15%;z-index:5;cursor:default}
  #panel{
    position:absolute;inset:0;background:rgba(10,8,7,.94);z-index:6;
    display:grid;place-items:center;padding:28px;cursor:auto;
  }
  #panel[hidden]{display:none}
  #panel .box{width:100%;max-width:320px;font-size:14px}
  #panel h2{font-size:16px;font-weight:600;margin:0 0 14px}
  #panel dl{margin:0 0 20px;display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13px}
  #panel dt{color:#8A7F73}
  #panel dd{margin:0;color:#F2EDE4;word-break:break-all}
  #panel button{
    font:inherit;font-size:14px;padding:11px 16px;margin-right:8px;
    background:#F2EDE4;color:#14110F;border:0;border-radius:4px;cursor:pointer;font-weight:600;
  }
  #panel button.ghost{background:transparent;color:#F2EDE4;border:1px solid rgba(242,237,228,.25);font-weight:400}

  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>
</head>
<body>

<div id="stage">
  <div class="slot" id="slotA"><div class="panes"></div></div>
  <div class="slot" id="slotB"><div class="panes"></div></div>

  <div id="sender"><i></i><span id="senderText"></span></div>

  <div id="msg">
    <div>
      <div class="m">Gamtan</div>
      <h1 id="msgTitle">사진을 불러오는 중입니다</h1>
      <p id="msgSub">잠시만 기다려 주세요</p>
    </div>
  </div>

  <div id="night"></div>
  <div id="corner"></div>

  <div id="panel" hidden>
    <div class="box">
      <h2>액자 정보</h2>
      <dl>
        <dt>액자 번호</dt><dd id="iCode">—</dd>
        <dt>사진</dt><dd id="iCount">—</dd>
        <dt>마지막 확인</dt><dd id="iSync">—</dd>
        <dt>상태</dt><dd id="iState">—</dd>
      </dl>
      <button id="pRefresh">지금 새로 받기</button>
      <button id="pClose" class="ghost">닫기</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ═══════════════════════════════════════════════════════════
   ▼▼▼ 여기 세 줄만 바꾸세요 ▼▼▼

   SB_URL, SB_KEY 는 관리 화면에 넣은 것과 똑같은 값입니다.
   FRAME_TOKEN 은 액자마다 다릅니다. 아까 GT-0001 만들 때
   나온 token 값을 넣으세요. 액자를 새로 팔 때마다 이 줄만
   바꿔서 그 액자에 넣으면 됩니다.
   ═══════════════════════════════════════════════════════════ */
var SB_URL      = "https://sdjhvtljrzkvniwdtwir.supabase.co";
var SB_KEY      = "sb_publishable_qoIwl7-UfHB2L3LsqnCu-g_t-_6B53R";
var FRAME_TOKEN = "여기에액자토큰";
/* ═══════════════════════════════════════════════════════════ */

var BUCKET   = "frame-photos";
var POLL_MS  = 5 * 60 * 1000;

(function(){
  "use strict";

  /* 주소 끝에 ?t=토큰 을 붙이면 그 값을 씁니다.
     그래서 공개된 코드에는 토큰이 남지 않고,
     파일 하나로 액자 여러 대를 쓸 수 있습니다. */
  var qs = new URLSearchParams(location.search).get("t");
  if(qs) FRAME_TOKEN = qs;

  var sb = window.supabase.createClient(SB_URL, SB_KEY);

  var conf = { interval_sec:30, pair_portrait:true, sleep_from:null, sleep_to:null, code:"—" };
  var photos = [], slides = [], idx = -1, useA = true;
  var timer = null, lastSync = null, lastKey = "", failCount = 0;

  var $ = function(id){ return document.getElementById(id); };
  var slotA = $("slotA"), slotB = $("slotB");
  var sender = $("sender"), senderText = $("senderText");
  var msg = $("msg"), night = $("night");

  function say(title, sub){
    $("msgTitle").textContent = title;
    $("msgSub").textContent = sub || "";
    msg.hidden = false;
  }

  function urlOf(path){
    return SB_URL + "/storage/v1/object/public/" + BUCKET + "/" + path;
  }

  /* ---------- 창고에서 받아오기 ---------- */
  function fetchManifest(){
    return sb.rpc("frame_manifest", { p_token: FRAME_TOKEN }).then(function(r){
      if(r.error || !r.data){
        failCount++;
        if(!photos.length){
          say("액자를 찾지 못했습니다", "사진관에 문의해 주세요");
        }
        return;
      }
      failCount = 0;
      lastSync = new Date();
      var d = r.data;

      conf.code          = d.code;
      conf.interval_sec  = d.interval_sec || 30;
      conf.pair_portrait = d.pair_portrait !== false;
      conf.sleep_from    = d.sleep_from;
      conf.sleep_to      = d.sleep_to;

      var list = d.photos || [];
      var key  = list.map(function(p){ return p.path; }).join("|");

      if(!list.length){
        lastKey = key;
        photos = []; slides = [];
        clearInterval(timer); timer = null;
        slotA.classList.remove("on"); slotB.classList.remove("on");
        say("아직 사진이 없습니다", "가족이 사진을 보내면 여기에 나옵니다");
        return;
      }

      if(key === lastKey && photos.length){ restart(); return; }
      lastKey = key;
      return measure(list);
    }, function(){
      failCount++;
      if(!photos.length) say("연결을 기다리는 중입니다", "와이파이를 확인해 주세요");
    });
  }

  /* ---------- 가로/세로 재기 ---------- */
  function measure(list){
    return new Promise(function(resolve){
      var out = [], left = list.length;
      list.forEach(function(p, i){
        var u = urlOf(p.path);
        var im = new Image();
        im.onload = im.onerror = function(){
          var w = im.naturalWidth || 1, h = im.naturalHeight || 1;
          out[i] = { url:u, by:p.by, name:p.name, portrait: h > w * 1.05 };
          if(--left === 0){
            photos = out.filter(Boolean);
            build();
            msg.hidden = true;
            idx = -1;
            next();
            restart();
            resolve();
          }
        };
        im.src = u;
      });
    });
  }

  function build(){
    slides = [];
    var i = 0;
    while(i < photos.length){
      if(conf.pair_portrait && photos[i].portrait && photos[i+1] && photos[i+1].portrait){
        slides.push([photos[i], photos[i+1]]); i += 2;
      }else{
        slides.push([photos[i]]); i += 1;
      }
    }
  }

  /* ---------- 넘기기 ---------- */
  function next(){
    if(!slides.length || isNight()) return;
    idx = (idx + 1) % slides.length;
    var group = slides[idx];
    var incoming = useA ? slotA : slotB;
    var outgoing = useA ? slotB : slotA;
    useA = !useA;

    var panes = incoming.querySelector(".panes");
    panes.innerHTML = "";
    group.forEach(function(p){
      var pane = document.createElement("div"); pane.className = "pane";
      var bg = document.createElement("div"); bg.className = "bg";
      bg.style.backgroundImage = 'url("' + p.url + '")';
      var im = document.createElement("img"); im.src = p.url; im.alt = "";
      pane.appendChild(bg); pane.appendChild(im);
      panes.appendChild(pane);
    });

    incoming.classList.add("on");
    outgoing.classList.remove("on");

    var names = [];
    group.forEach(function(p){ if(p.by && names.indexOf(p.by) < 0) names.push(p.by); });
    if(names.length){
      sender.classList.remove("on");
      senderText.textContent = names.join(", ") + "이(가) 보냈어요";
      setTimeout(function(){ sender.classList.add("on"); }, 400);
      setTimeout(function(){ sender.classList.remove("on"); }, 6000);
    }

    var nx = slides[(idx + 1) % slides.length];
    if(nx) nx.forEach(function(p){ var i2 = new Image(); i2.src = p.url; });
  }

  function restart(){
    clearInterval(timer);
    if(slides.length > 1) timer = setInterval(next, conf.interval_sec * 1000);
  }

  /* ---------- 밤에 끄기 ---------- */
  function isNight(){
    if(!conf.sleep_from || !conf.sleep_to) return false;
    var d = new Date();
    var now = d.getHours() * 60 + d.getMinutes();
    var a = toMin(conf.sleep_from), b = toMin(conf.sleep_to);
    if(a === b) return false;
    return (a < b) ? (now >= a && now < b) : (now >= a || now < b);
  }
  function toMin(t){
    var p = String(t).split(":");
    return (+p[0]) * 60 + (+p[1] || 0);
  }
  setInterval(function(){
    var on = isNight();
    night.classList.toggle("on", on);
    if(on) clearInterval(timer);
    else if(!timer && slides.length > 1) restart();
  }, 20000);

  /* ---------- 숨은 문 ---------- */
  var taps = 0, tapTimer = null;
  $("corner").addEventListener("click", function(){
    taps++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(function(){ taps = 0; }, 2500);
    if(taps >= 5){
      taps = 0;
      $("iCode").textContent  = conf.code;
      $("iCount").textContent = photos.length + "장 · 화면 " + slides.length + "개";
      $("iSync").textContent  = lastSync ? lastSync.toLocaleString("ko-KR") : "아직 없음";
      $("iState").textContent = failCount ? "연결 실패 " + failCount + "회" : "정상";
      $("panel").hidden = false;
    }
  });
  $("pClose").addEventListener("click", function(){ $("panel").hidden = true; });
  $("pRefresh").addEventListener("click", function(){
    $("panel").hidden = true;
    lastKey = "";
    fetchManifest();
  });

  /* ---------- 시작 ---------- */
  fetchManifest();
  setInterval(fetchManifest, POLL_MS);
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden) fetchManifest();
  });
})();
</script>
</body>
</html>
