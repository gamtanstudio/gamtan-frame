<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>감탄 액자 — 발급</title>
<style>
  :root{
    --paper:#FAF7F2; --card:#FFF; --ink:#241F1A; --ink-2:#5A5148;
    --muted:#8C8177; --brass:#9A7B45; --brass-soft:#F2EAD9;
    --danger:#A4453A; --ok:#3F7A4C; --line:#E6DFD4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:60px;
  }
  .wrap{max-width:600px;margin:0 auto;padding:0 18px}
  [hidden]{display:none !important}

  header{padding:26px 0 18px}
  .brand{font-size:11px;letter-spacing:.34em;color:var(--brass);text-transform:uppercase}
  header h1{font-size:22px;font-weight:600;margin-top:7px}
  header p{font-size:13px;color:var(--muted);margin-top:3px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
  .card h2{font-size:15px;font-weight:600;margin-bottom:4px}
  .card .sub{font-size:12.5px;color:var(--muted);margin-bottom:16px}

  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:5px}
  .field input{
    width:100%;font:inherit;font-size:15px;padding:11px;
    border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);
  }
  .field input:focus{outline:2px solid var(--brass);outline-offset:-1px;border-color:transparent}
  .field .note{font-size:11.5px;color:var(--muted);margin-top:4px}

  button{font:inherit;cursor:pointer}
  .primary{
    width:100%;background:var(--ink);color:var(--paper);border:0;border-radius:9px;
    font-size:15px;font-weight:600;padding:14px;
  }
  .primary:disabled{background:var(--muted);cursor:default}
  .ghost{
    background:transparent;color:var(--ink-2);border:1px solid var(--line);
    border-radius:7px;font-size:12.5px;padding:7px 12px;
  }
  .ghost:hover{background:var(--paper)}

  .msg{font-size:13px;margin-top:12px;min-height:20px}
  .msg.bad{color:var(--danger)}
  .msg.good{color:var(--ok)}

  /* 발급 결과 */
  #result{border-color:var(--brass);background:#FFFDF9}
  .out{margin-bottom:15px}
  .out .k{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
  .out .v{
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;
    background:var(--paper);border:1px solid var(--line);border-radius:7px;
    padding:9px 11px;word-break:break-all;line-height:1.7;
  }
  .out .row{display:flex;gap:8px;align-items:flex-start}
  .out .row .v{flex:1}
  .big{
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:24px;font-weight:700;
    letter-spacing:.08em;color:#6B5327;background:var(--brass-soft);
    border-radius:8px;padding:12px 16px;text-align:center;
  }
  .warn{
    font-size:12.5px;color:var(--ink-2);background:#FBF3E8;
    border:1px solid #EBDCC2;border-radius:8px;padding:11px 13px;margin-top:6px;line-height:1.7;
  }

  /* 목록 */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
  th{font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;font-weight:500}
  td .mono,td.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
  .dim{color:var(--muted)}

  #boot,#gate{min-height:70vh;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:24px}

  /* QR 카드 (인쇄용) */
  #qrCard{width:260px;margin:0 auto 6px;border:1px solid var(--line);border-radius:12px;padding:22px 18px;text-align:center;background:#fff}
  #qrCard .qc-brand{font-size:10px;letter-spacing:.42em;color:var(--brass)}
  #qrCard .qc-title{font-size:18px;font-weight:600;margin:4px 0 14px}
  #qrBox{display:flex;justify-content:center}
  #qrBox img,#qrBox canvas{width:180px;height:180px}
  #qrCard .qc-how{font-size:12.5px;color:var(--ink-2);margin-top:14px;line-height:1.55}
  #qrCard .qc-code{font-size:11px;color:var(--muted);margin-top:8px;letter-spacing:.08em}
  #printBtn{display:block;margin-left:auto !important;margin-right:auto !important}
  .rowbtn{font-size:12px;padding:4px 9px}
  @media print{
    body *{visibility:hidden !important}
    #qrCard,#qrCard *{visibility:visible !important}
    #qrCard{position:absolute;left:0;top:0;border:1px solid #ccc}
  }
</style>
</head>
<body>

<div id="boot">불러오는 중…</div>

<div id="login" class="wrap" hidden style="max-width:340px;padding-top:16vh">
  <div class="brand">Gamtan</div>
  <h1 style="font-size:22px;font-weight:600;margin:9px 0 4px">액자 발급</h1>
  <p style="font-size:13px;color:var(--muted);margin-bottom:22px">직원용 화면입니다</p>
  <div class="field"><label for="e">이메일</label><input id="e" type="email" autocomplete="username"></div>
  <div class="field"><label for="p">비밀번호</label><input id="p" type="password" autocomplete="current-password"></div>
  <p class="msg bad" id="loginErr"></p>
  <button class="primary" id="signin">로그인</button>
</div>

<div id="gate" hidden>
  이 계정은 직원으로 등록되어 있지 않습니다.<br>
  <button class="ghost" id="out2" style="margin-top:14px">로그아웃</button>
</div>

<div id="app" class="wrap" hidden>
  <header>
    <div class="brand">Gamtan</div>
    <h1>액자 발급</h1>
  </header>

  <div class="card">
    <h2>새 액자 발급</h2>
    <div class="field">
      <label for="label">액자 이름</label>
      <input id="label" type="text" maxlength="40">
    </div>
    <button class="primary" id="issue">발급하기</button>
    <p class="msg" id="msg"></p>
  </div>

  <div class="card" id="result" hidden>
    <h2>발급 완료</h2>

    <div id="qrCard">
      <div class="qc-brand">GAMTAN</div>
      <div class="qc-title">감탄 액자</div>
      <div id="qrBox"></div>
      <div class="qc-how">휴대폰 카메라로 찍어서<br>액자를 연결해 주세요</div>
      <div class="qc-code" id="qcCode">—</div>
    </div>
    <button class="ghost" id="printBtn" style="margin:4px 0 16px">QR 카드 인쇄</button>

    <div class="out">
      <div class="k">액자 번호</div>
      <div class="big" id="rCode">—</div>
    </div>

    <div class="out">
      <div class="k">기기에 넣을 토큰</div>
      <div class="row">
        <div class="v" id="rToken">—</div>
        <button class="ghost" data-copy="rToken">복사</button>
      </div>
      <div class="warn">토큰은 고객에게 주지 않습니다. 출고 전에 액자 기기에만 넣습니다.</div>
    </div>

    <div class="out">
      <div class="k">QR 주소</div>
      <div class="row">
        <div class="v" id="rJoin">—</div>
        <button class="ghost" data-copy="rJoin">복사</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>발급한 액자</h2>
    <div class="sub" id="listSub">불러오는 중…</div>
    <table>
      <thead><tr><th>번호</th><th>이름</th><th>고객 연결</th><th>마지막 확인</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <button class="ghost" id="out">로그아웃</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SB_URL  = "https://sdjhvtljrzkvniwdtwir.supabase.co";
var SB_KEY  = "sb_publishable_qoIwl7-UfHB2L3LsqnCu-g_t-_6B53R";
var BASE    = location.href.replace(/[^/]*$/, "");   /* 같은 폴더의 index.html / frame.html */

(function(){
  "use strict";
  var sb = window.supabase.createClient(SB_URL, SB_KEY);
  var $ = function(i){ return document.getElementById(i); };

  /* ---------- 로그인 ---------- */
  $("signin").addEventListener("click", signIn);
  $("p").addEventListener("keydown", function(e){ if(e.key === "Enter") signIn(); });

  function signIn(){
    var b = $("signin");
    $("loginErr").textContent = ""; b.disabled = true; b.textContent = "로그인 중…";
    sb.auth.signInWithPassword({ email: $("e").value.trim(), password: $("p").value })
      .then(function(r){
        b.disabled = false; b.textContent = "로그인";
        if(r.error){ $("loginErr").textContent = "이메일이나 비밀번호를 확인해주세요"; return; }
        start();
      });
  }
  function bye(){ sb.auth.signOut().then(function(){ location.reload(); }); }
  $("out").addEventListener("click", bye);
  $("out2").addEventListener("click", bye);

  sb.auth.getSession().then(function(r){
    if(r.data && r.data.session) start();
    else { $("boot").hidden = true; $("login").hidden = false; }
  });

  function start(){
    $("boot").hidden = false; $("login").hidden = true;
    $("boot").textContent = "권한을 확인하는 중…";
    sb.rpc("is_staff").then(function(r){
      if(r.error || r.data !== true){
        $("boot").hidden = true; $("gate").hidden = false; return;
      }
      $("boot").hidden = true; $("app").hidden = false;
      loadList();
    });
  }

  /* ---------- 발급 ---------- */
  /* 헷갈리는 글자(0 O 1 I L) 뺀 8자리 연결 코드 */
  function newClaimCode(){
    var A = "ABCDEFGHJKMNPQRSTUVWXYZ23456789", out = "";
    var r = new Uint32Array(8); crypto.getRandomValues(r);
    for(var i = 0; i < 8; i++) out += A[r[i] % A.length];
    return out;
  }

  $("issue").addEventListener("click", function(){
    var label = $("label").value.trim();
    var m = $("msg"), btn = $("issue");
    m.className = "msg"; m.textContent = "";
    btn.disabled = true; btn.textContent = "발급 중…";

    nextCode()
      .then(function(code){
        return sb.from("frames").insert({ code: code, label: label || null, claim_code: newClaimCode() })
                 .select("id, code, token, claim_code").single();
      })
      .then(function(r){
        if(r.error) throw new Error("액자를 만들지 못했습니다");
        show(r.data);
        m.className = "msg good"; m.textContent = "발급되었습니다";
        $("label").value = "";
        loadList();
      })
      .catch(function(err){
        m.className = "msg bad";
        m.textContent = (err && err.message) || "발급에 실패했습니다";
      })
      .then(function(){ btn.disabled = false; btn.textContent = "발급하기"; });
  });

  /* 다음 액자 번호 */
  function nextCode(){
    return sb.from("frames").select("code").order("code", { ascending: false }).limit(1)
      .then(function(r){
        var n = 1;
        if(r.data && r.data.length){
          var mm = String(r.data[0].code).match(/(\d+)\s*$/);
          if(mm) n = parseInt(mm[1], 10) + 1;
        }
        return "GT-" + String(n).padStart(4, "0");
      });
  }

  function joinUrl(cc){ return BASE + "index.html?c=" + cc; }

  function show(f){
    $("rCode").textContent  = f.code;
    $("qcCode").textContent = f.code;
    $("rToken").textContent = f.token;
    var url = f.claim_code ? joinUrl(f.claim_code) : "";
    $("rJoin").textContent = url || "—";
    var box = $("qrBox"); box.innerHTML = "";
    if(url) new QRCode(box, { text: url, width: 360, height: 360, correctLevel: QRCode.CorrectLevel.M });
    $("result").hidden = false;
    $("result").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  $("printBtn").addEventListener("click", function(){ window.print(); });

  /* 복사 */
  document.addEventListener("click", function(e){
    var b = e.target.closest("[data-copy]");
    if(!b) return;
    var txt = $(b.dataset.copy).textContent;
    navigator.clipboard.writeText(txt).then(function(){
      var old = b.textContent; b.textContent = "복사됨";
      setTimeout(function(){ b.textContent = old; }, 1400);
    }, function(){ b.textContent = "복사 실패"; });
  });

  /* ---------- 목록 ---------- */
  var listData = [];
  function loadList(){
    sb.from("frames").select("id, code, label, token, claim_code, claimed_at, last_seen_at").order("code", { ascending: false })
      .then(function(r){
        var rows = $("rows"); rows.innerHTML = "";
        listData = r.data || [];
        $("listSub").textContent = listData.length ? "모두 " + listData.length + "대" : "아직 발급한 액자가 없습니다";
        listData.forEach(function(f, i){
          var tr = document.createElement("tr");
          function td(txt, cls){ var d = document.createElement("td"); d.textContent = txt; if(cls) d.className = cls; tr.appendChild(d); return d; }
          td(f.code, "mono");
          td(f.label || "—", f.label ? "" : "dim");
          td(f.claimed_at ? "연결됨" : (f.claim_code ? "대기" : "—"), f.claimed_at ? "" : "dim");
          td(ago(f.last_seen_at), "dim");
          var c = td("");
          if(f.claim_code){
            var b = document.createElement("button");
            b.className = "ghost rowbtn"; b.textContent = "QR"; b.dataset.i = i;
            c.appendChild(b);
          }
          rows.appendChild(tr);
        });
      });
  }
  $("rows").addEventListener("click", function(e){
    var b = e.target.closest("button[data-i]");
    if(b) show(listData[+b.dataset.i]);
  });

  function ago(t){
    if(!t) return "연결 전";
    var m = Math.floor((Date.now() - new Date(t).getTime()) / 60000);
    if(m < 1)    return "방금";
    if(m < 60)   return m + "분 전";
    if(m < 1440) return Math.floor(m/60) + "시간 전";
    return Math.floor(m/1440) + "일 전";
  }
})();
</script>
</body>
</html>
